; Squelette PlatformIO (Arduino-ESP32) du pouf vibrant Incognito.
; Ne se compile dans ce dépôt que si le SDK Espressif est installé.
; La logique testée est le jumeau Python : incognito.pilotage / presence.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
